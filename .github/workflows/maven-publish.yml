name: Java CI with Maven

# Ten przepływ pracy uruchamia się przy każdym push do gałęzi 'main'
# oraz przy każdym Pull Request skierowanym do gałęzi 'main'.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Uruchom ten job na najnowszej wersji Ubuntu
    runs-on: ubuntu-latest

    steps:
      # Krok 1: Pobranie kodu z repozytorium
      - name: Checkout repository
        uses: actions/checkout@v4

      # Krok 2: Ustawienie środowiska Java
      # Na podstawie pliku pom.xml, projekt wymaga Javy w wersji 8
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      # Krok 3: Zbudowanie projektu za pomocą Mavena
      # Użycie polecenia 'package' skompiluje kod i utworzy plik .jar w folderze 'target'
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # Opcjonalny Krok 4: Przesłanie artefaktu (pliku .jar)
      # Ten krok zapisze zbudowany plik .jar, aby można go było pobrać po zakończeniu przepływu pracy.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VillagerTradeLimiter-Plugin
          path: target/VillagerTradeLimiter-*.jar
