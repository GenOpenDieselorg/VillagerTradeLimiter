name: Build VillagerTradeLimiter Plugin

on:
  push:
    branches: [ "main" ] # Uruchom przy push do gałęzi main
  pull_request:
    branches: [ "main" ] # Uruchom przy pull request do gałęzi main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build project with Maven
        run: mvn -B package --file pom.xml

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: VillagerTradeLimiter-Plugin-Jar
          path: target/VillagerTradeLimiter-*.jar
