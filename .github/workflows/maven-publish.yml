name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Nadanie uprawnień do odczytu zawartości repozytorium

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ustawienie Javy w wersji 17, która jest standardem dla nowych wersji Minecraft
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        # Czyste budowanie paczki, pomijając testy, które nie są potrzebne w tym projekcie
        run: mvn clean package -DskipTests

      # Przesłanie zbudowanego pliku .jar jako artefaktu
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VillagerTradeLimiter-Plugin
          # Użycie `find` zapewnia, że plik .jar zostanie znaleziony, nawet jeśli nazwa się zmieni
          path: ${{ github.workspace }}/target/VillagerTradeLimiter-*.jar
